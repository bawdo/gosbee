version: 2
updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    # /tools holds CI tooling (govulncheck), kept out of the library's go.mod
    directories:
      - "/"
      - "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release, so a compromised version is
    # likely to be caught and yanked first. Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Bump"
    groups:
      # Bundle all minor and patch bumps into a single PR to cut noise
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release, so a compromised version is
    # likely to be caught and yanked first. Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Bump"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
