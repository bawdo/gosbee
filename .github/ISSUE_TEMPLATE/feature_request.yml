name: Feature request
description: Suggest a feature or a change in behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The query or problem you are trying to solve, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
      description: How you think it could look, in Go or as the SQL you want generated, if you have an idea.
      render: go
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the README and the guides under docs/guide, and this is not already supported.
          required: true
