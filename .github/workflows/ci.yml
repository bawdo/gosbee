name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Weekly run so newly published vulnerabilities and toolchain changes
  # surface without waiting for a pull request.
  schedule:
    - cron: '17 3 * * 1'

# Cancel superseded runs on a pull request, never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so the changelog check can see every tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # golangci-lint-action (v5+) leaves the Go build cache to setup-go,
          # so keep it on. Key on the tools module too, for govulncheck.
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Must be built with a Go at least as new as `stable` above, or it
          # cannot type-check the standard library. Bump it when Go releases.
          # Dependabot does not track this input.
          version: v2.15.0
          args: --timeout=5m

      - name: Lint shell scripts
        env:
          # The runner image ships an older shellcheck that can disagree with
          # current releases, so install this one and check its digest before
          # extracting. Dependabot does not track it: bump both together.
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" scripts/*.sh

      - name: Test the CI OK gate script
        run: scripts/ci-result_test.sh

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
          go -C tools mod tidy -diff

      - name: Check CHANGELOG.md
        run: scripts/changelog.sh check

      - name: Scan for known vulnerabilities
        # Pinned in tools/go.mod, so Dependabot keeps it current.
        run: go -C tools tool govulncheck -C .. ./...

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true

  test:
    name: Test (${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    strategy:
      fail-fast: false
      matrix:
        # oldstable is the floor go.mod declares; stable is the current release.
        include:
          - { os: ubuntu-latest, go: oldstable, race: true }
          - { os: ubuntu-latest, go: stable, race: true, coverage: true }
          - { os: macos-latest, go: stable }

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # -count=1 stops the restored build cache from replaying earlier results.
      # -shuffle=on randomises test order to expose order-dependent tests; a
      # failing run prints its seed, rerun with -shuffle=<seed> to reproduce.
      - name: Run tests
        env:
          RACE: ${{ matrix.race && 'true' || 'false' }}
          COVERAGE: ${{ matrix.coverage && 'true' || 'false' }}
        run: |
          args=(-count=1 -shuffle=on)
          if [ "$RACE" = true ]; then
            args+=(-race)
          fi
          if [ "$COVERAGE" = true ]; then
            COVERPKG=$(go list ./... | grep -v testutil | tr '\n' ',' | sed 's/,$//')
            args+=(-coverprofile=coverage.txt -covermode=atomic -coverpkg="$COVERPKG")
          fi
          go test "${args[@]}" ./...
        shell: bash

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage.txt
          fail_ci_if_error: false
          verbose: true

  # The single required check, so the main ruleset never has to track job or
  # matrix names. Every job in needs must pass except those the event skips on
  # purpose, which scripts/ci-result.sh decides (today, none). A failed,
  # cancelled, missing or wrongly skipped job fails the gate. EVENT and NEEDS
  # go in through env, never into the script, and scripts/ci-result_test.sh
  # checks this job's needs against the script's job list.
  ci-ok:
    name: CI OK
    if: always()
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail unless every expected job passed
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-result.sh
