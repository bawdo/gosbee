name: Release

# Pushing a vX.Y.Z tag (or vX.Y.Z-suffix, a pre-release) publishes its GitHub
# release. CI runs first, on the tag itself (ci.yml, called with the tag's
# ref). The build job then checks the tag is annotated, signed (GitHub
# verifies the signature) and on main, and that CHANGELOG.md is consistent.
# The release notes are the version's changelog section, never written by
# hand. REPL binaries for linux and darwin on amd64 and arm64 are built and
# smoke tested, CycloneDX SBOMs are written for the module and for each
# binary, and all of them are listed in SHA256SUMS. The publish job attests
# that set with build provenance and attaches the attestation's Sigstore
# bundle as gosbee-repl_<tag>_provenance.intoto.jsonl. Last, the proxy job
# checks that proxy.golang.org serves the tagged commit and sum.golang.org
# records the version.
#
# Only the publish job can write to the repository, and it checks out nothing
# but scripts/publish-release.sh, from the commit the build job built (never
# the tag by name), and runs no Go and no dependency. Before its first write
# it checks, read only, that the release is not already published and that
# the tag still points at the tag object the build verified; the script
# checks the tag again just before it creates the release. The build job
# compiles with a read-only token and without the Go cache, so neither a
# token nor a poisoned cache entry is in reach of the code that ends up in
# the release.
#
# A published release is never changed, its notes included: a changelog fix
# made after release lives in CHANGELOG.md only. If a run fails before the
# release is published, fix the cause and run this workflow by hand, from
# main, with the existing tag: a leftover draft is replaced and the release
# published. A by-hand run on a tag already published stops at publish's
# check ("already published") and skips the proxy job. To repeat a failed
# proxy check, "Re-run failed jobs" on the original run re-runs the proxy job
# alone when publish succeeded, while the proxy-check artifact lasts (1 day);
# after that, run scripts/check-module-proxy.sh <module> <tag> <commit> by
# hand from a checkout of the tag.
#
# A dispatched run uses this file and ci.yml from the branch it is dispatched
# from, so its checks bind only when that is main, and its provenance names
# that branch, not the tag, as the source. CONTRIBUTING.md (Releasing) has
# the detail and the repository settings that would close this.

permissions:
  contents: read

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z or vX.Y.Z-suffix tag to publish again
        type: string
        required: true

# Keyed on the tag, so a tag push and a re-run for the same tag queue behind
# each other and never publish at once.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # A job-level reusable workflow call is resolved from this workflow's own
    # commit, never the runner's filesystem, so "./" is as pinned as zizmor's
    # suggested "$/" here. "./" stays because actionlint cannot read "$/" and
    # checks the ref input against ci.yml only through it.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      # Fully qualified, so a dispatch re-run tests the tag, not the branch it
      # was dispatched from.
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build:
    name: Build release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # The tagged commit, for the publish and proxy jobs.
      commit: ${{ steps.tagged.outputs.commit }}
      # The tag object verify-tag.sh found on GitHub and checked out here,
      # which publish requires the tag still to point at.
      tag_object: ${{ steps.tagged.outputs.tag_object }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # The dispatch input reaches checkout below, so check its shape first.
      - name: Check the tag name
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the tag to release is not of the form vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Fully qualified, so a branch with the tag's name is never built.
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check the tag is on main
        id: tagged
        run: |
          set -euo pipefail
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "::error::the checked-out commit is not the commit $TAG points at"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag_object=$(git rev-parse "refs/tags/$TAG")" >> "$GITHUB_OUTPUT"

      - name: Check the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-tag.sh "$TAG"

      - name: Check the changelog
        run: scripts/changelog.sh check

      - name: Write release notes
        run: |
          set -euo pipefail
          scripts/changelog.sh notes "$TAG" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # No cache: ci.yml jobs write it after testing every dependency.
          cache: false

      - name: Verify module checksums
        run: go mod verify

      - name: Build and smoke test the binaries, and write their SBOMs
        run: scripts/build-release.sh "$TAG"

      - name: Keep the binaries and SBOMs for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/gosbee-repl_*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      # The proxy job has no checkout, so it runs the script from this job's
      # read-only checkout of the tag.
      - name: Keep the proxy check for the proxy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxy-check
          path: scripts/check-module-proxy.sh
          if-no-files-found: error
          retention-days: 1

      - name: Keep the release notes for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Once scripts/repo-settings.sh harden is applied, its deployment policy
    # admits only v* tags and main, so this file dispatched from another
    # branch cannot publish. A branch that edits this file can drop the line.
    environment: release
    permissions:
      contents: write     # create the release and upload its assets
      id-token: write     # sign the build provenance attestation
      attestations: write # store the attestation
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # The commit the build job verified and built, never the tag by name:
      # a tag moved since then must not choose the script that runs here.
      - name: Checkout the publish script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/publish-release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}

      # Read only, and before the first write (the attestation, which also
      # makes a public transparency log entry): refuses a release already
      # published and a tag that no longer points at the tag object built.
      - name: Check the tag and the release before any write
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: scripts/publish-release.sh --check "$TAG" "$TAG_OBJECT"

      - name: Fetch the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Fetch the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Check the binaries match their checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: scripts/publish-release.sh "$TAG" "$TAG_OBJECT" notes/notes.md "$BUNDLE_PATH"

  # Runs after publish, so its failure cannot stop the release, only report
  # it. A commit mismatch means the tag moved after the proxy fetched it,
  # which nothing undoes: the version needs a retract in go.mod and a new
  # tag. The job has no checkout and no Go: the script comes from the build
  # job's read-only checkout of the tag, and the commit is the build job's
  # output, so a dispatch re-run checks the tagged commit, never the
  # dispatching branch's.
  proxy:
    name: Check the module proxy
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Fetch the proxy check
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proxy-check
          path: proxy-check

      # bash, because an artifact does not keep the executable bit.
      - name: Check proxy.golang.org and sum.golang.org
        env:
          MODULE: github.com/bawdo/gosbee
          TAG: ${{ inputs.tag || github.ref_name }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: bash proxy-check/check-module-proxy.sh "$MODULE" "$TAG" "$COMMIT"
