coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # Gating. The project target is measured, not chosen: total statement
    # coverage with the ignore list below applied was 93.9% on 2026-11-01
    # (unit 04 of the repo-quality workstream), rounded down. Raise it as
    # coverage rises; never lower it to pass a pull request.
    project:
      default:
        target: 93%
        threshold: 0.5%
        informational: false
        if_ci_failed: error

    # New and changed lines must be 80% covered. Lower than the project
    # target because a small patch moves in large steps (one uncovered line
    # in five is 80%), and the project status already stops the total drifting.
    patch:
      default:
        target: 80%
        threshold: 0.5%
        informational: false
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "cmd/repl"            # REPL UI code harder to unit test
  - "**/*_test.go"        # Test files themselves
  - "**/testdata"         # Test data
  - "**/*.pb.go"          # Generated protobuf files
  - "internal/testutil"   # Test utilities and helpers

github_checks:
  annotations: true
